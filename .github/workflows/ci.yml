name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, lint and types
        run: pnpm run check
      - name: Run tests
        run: pnpm test
      - name: Verify beta release policy
        run: pnpm run verify:beta-release
      - name: Build project and Worker
        run: pnpm run build
      - name: Check package contents
        run: npm pack --dry-run
